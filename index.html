<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Registro de Cargas</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a0a;
    color: #f5f5f5;
    padding-bottom: 40px;
  }
  .container { max-width: 480px; margin: 0 auto; padding: 16px; }
  h1 {
    font-size: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px 0 20px;
  }
  h2.section-title {
    font-size: 13px;
    color: #737373;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 22px 4px 8px;
  }
  .card {
    background: #171717;
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
  }
  input {
    width: 100%;
    background: #262626;
    border: none;
    border-radius: 10px;
    padding: 12px;
    color: #fff;
    font-size: 16px;
    margin-bottom: 8px;
    outline: none;
  }
  input:focus { box-shadow: 0 0 0 2px #a3e635aa; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  button.add {
    width: 100%;
    background: #a3e635;
    color: #0a0a0a;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    font-weight: 700;
    margin-top: 4px;
  }
  button.add:active { transform: scale(0.98); }
  button.cancel-edit {
    width: 100%;
    background: transparent;
    color: #a3a3a3;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 11px;
    font-size: 13px;
    font-weight: 600;
    margin-top: 8px;
    display: none;
  }
  button.cancel-edit.show { display: block; }
  .editing-badge {
    display: none;
    background: #a3e63522;
    color: #a3e635;
    font-size: 12px;
    font-weight: 700;
    border-radius: 8px;
    padding: 6px 10px;
    margin-bottom: 10px;
  }
  .editing-badge.show { display: block; }
  .error { color: #f87171; font-size: 13px; margin-bottom: 8px; }
  .hint { color: #737373; font-size: 11px; margin: -4px 0 10px; }
  .ex-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    cursor: pointer;
  }
  .ex-name { font-weight: 600; font-size: 15px; }
  .ex-last { color: #a3a3a3; font-size: 12px; margin-top: 2px; }
  .ex-pr { color: #facc15; font-size: 11px; margin-top: 2px; font-weight: 600; }
  .ex-warn { color: #fb923c; font-size: 11px; margin-top: 3px; font-weight: 600; }
  .diff { font-size: 12px; font-weight: 600; }
  .diff.pos { color: #a3e635; }
  .diff.neg { color: #f87171; }
  .ex-body { padding: 0 16px 16px; display: none; }
  .ex-body.open { display: block; }
  .entry {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #262626aa;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    margin-bottom: 6px;
    gap: 6px;
  }
  .entry-date { color: #a3a3a3; flex: none; }
  .entry-mid { flex: 1; text-align: left; }
  .pr-badge { color: #facc15; margin-left: 4px; }
  .entry-actions { display: flex; gap: 2px; flex: none; }
  .entry-edit, .entry-del { background: none; border: none; font-size: 17px; padding: 6px 8px; line-height: 1; }
  .entry-edit { color: #93c5fd; }
  .entry-del { color: #f87171; }
  .empty { text-align: center; color: #737373; font-size: 14px; padding: 40px 0; }
  svg { width: 100%; height: 130px; margin-bottom: 10px; }
  .exercise-card { padding: 0; overflow: hidden; }
  .day-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 10px;
  }
  .day-tab {
    flex: none;
    background: #262626;
    border: 1px solid #333;
    color: #d4d4d4;
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .day-tab.active {
    background: #a3e635;
    color: #0a0a0a;
    border-color: #a3e635;
  }
  .ex-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .ex-chip {
    background: #262626;
    border: 1px solid #333;
    color: #f5f5f5;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    text-align: left;
    flex: 1 1 calc(50% - 8px);
  }
  .ex-chip.selected {
    background: #a3e63522;
    border-color: #a3e635;
    color: #a3e635;
    font-weight: 600;
  }
  .start-workout-btn {
    width: 100%;
    background: #262626;
    border: 1px dashed #a3e635;
    color: #a3e635;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .workout-panel { display: none; }
  .workout-top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .workout-progress {
    color: #a3e635;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .workout-exit-x {
    background: #262626;
    border: 1px solid #333;
    color: #a3a3a3;
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 700;
  }
  .workout-exname {
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .rest-timer {
    display: none;
    background: #1a1f0f;
    border: 1px solid #3d4a1a;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
    text-align: center;
  }
  .rest-timer.show { display: block; }
  .rest-timer.done {
    background: #14251a;
    border-color: #a3e635;
  }
  .rest-label {
    color: #a3a3a3;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }
  .rest-clock {
    font-size: 40px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #a3e635;
    margin-bottom: 10px;
  }
  .rest-clock.done { color: #a3e635; }
  .rest-controls { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .rest-btn {
    background: #262626;
    border: 1px solid #3a3a3a;
    color: #f5f5f5;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
  }
  .rest-btn.primary {
    background: #a3e635;
    color: #0a0a0a;
    border-color: #a3e635;
  }
  .workout-actions { display: flex; gap: 8px; margin-top: 8px; }
  .skip-btn {
    flex: none;
    background: transparent;
    border: 1px solid #333;
    color: #a3a3a3;
    border-radius: 10px;
    padding: 13px 14px;
    font-size: 13px;
    font-weight: 600;
  }
  .exit-workout-btn {
    width: 100%;
    background: transparent;
    color: #737373;
    border: none;
    padding: 10px;
    font-size: 12px;
    margin-top: 4px;
  }
  .backup-row { display: flex; gap: 8px; }
  .backup-btn {
    flex: 1;
    background: #262626;
    border: 1px solid #333;
    color: #f5f5f5;
    border-radius: 10px;
    padding: 11px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
  }
  input[type=file] { display: none; }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #262626;
    border: 1px solid #a3e635;
    color: #a3e635;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 99;
  }
  .toast.show { opacity: 1; }
  .footer-note {
    text-align: center;
    color: #525252;
    font-size: 11px;
    margin-top: 24px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🏋️ Registro de Cargas</h1>

  <div class="card">
    <div class="editing-badge" id="editingBadge">✏️ Editando registro</div>

    <div id="dayTabs" class="day-tabs"></div>
    <div id="exGrid" class="ex-grid"></div>
    <button class="start-workout-btn" id="startWorkoutBtn" onclick="startWorkout()">▶ Empezar entrenamiento de hoy</button>

    <div class="workout-panel" id="workoutPanel">
      <div class="workout-top-row">
        <div class="workout-progress" id="workoutProgress"></div>
        <button class="workout-exit-x" onclick="exitWorkout()">✕ Salir</button>
      </div>
      <div class="workout-exname" id="workoutExName"></div>

      <div class="rest-timer" id="restTimer">
        <div class="rest-label" id="restLabel">Descanso</div>
        <div class="rest-clock" id="restClock">2:30</div>
        <div class="rest-controls">
          <button class="rest-btn" onclick="adjustRest(-15)">-15s</button>
          <button class="rest-btn" id="restPauseBtn" onclick="togglePauseRest()">Pausar</button>
          <button class="rest-btn" onclick="adjustRest(15)">+15s</button>
          <button class="rest-btn primary" onclick="hideRestTimer()">Listo</button>
        </div>
      </div>
    </div>

    <input type="hidden" id="exercise">
    <div class="row3">
      <input id="weight" type="number" inputmode="decimal" placeholder="Kg">
      <input id="reps" type="number" inputmode="numeric" placeholder="Reps">
      <input id="sets" type="number" inputmode="numeric" placeholder="Series">
    </div>
    <div class="hint" id="lastHint"></div>
    <input id="date" type="date">
    <div id="error" class="error" style="display:none"></div>

    <div class="workout-actions" id="workoutActions" style="display:none">
      <button class="add" id="addBtnWorkout" onclick="addEntry()" style="flex:1">Guardar y siguiente ▶</button>
      <button class="skip-btn" onclick="skipWorkoutStep()">Saltar</button>
    </div>
    <button class="add" id="addBtn" onclick="addEntry()">+ Añadir registro</button>
    <button class="cancel-edit" id="cancelEditBtn" onclick="cancelEdit()">Cancelar edición</button>
    <button class="exit-workout-btn" id="exitWorkoutBtn" style="display:none" onclick="exitWorkout()">Salir del modo entrenamiento</button>
  </div>

  <div id="list"></div>

  <h2 class="section-title">Copia de seguridad</h2>
  <div class="card">
    <div class="backup-row">
      <button class="backup-btn" onclick="exportData()">⬇️ Exportar</button>
      <label class="backup-btn" for="importFile">⬆️ Importar</label>
      <input type="file" id="importFile" accept="application/json" onchange="importData(event)">
    </div>
  </div>

  <div class="footer-note">Los datos se guardan en este dispositivo/navegador.<br>Haz un backup de vez en cuando por si cambias de móvil o borras caché.</div>
</div>

<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = 'gym_entries_v1';
  let entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let openExercise = null;
  let editingId = null;
  let workoutMode = false;
  let workoutList = [];
  let workoutIndex = 0;

  const ROUTINE = {
    'Lunes/Viernes · Espalda y Bíceps': [
      'Remo polea a una mano',
      'Remo en T',
      'Jalón al pecho',
      'Remo con barra',
      'Curl barra',
      'Curl martillo'
    ],
    'Martes/Sábado · Pecho y Tríceps': [
      'Press banca',
      'Fondos/Flexiones',
      'Tríceps polea',
      'Tríceps nuca polea',
      'Tríceps nuca mancuerna'
    ],
    'Miércoles · Hombro': [
      'Press militar',
      'Elevaciones laterales',
      'Pájaros'
    ]
  };

  const dayNames = Object.keys(ROUTINE);
  const todayIdx = new Date().getDay();
  let selectedDay = (todayIdx === 1 || todayIdx === 5) ? dayNames[0]
                   : (todayIdx === 2 || todayIdx === 6) ? dayNames[1]
                   : (todayIdx === 3) ? dayNames[2]
                   : dayNames[0];
  let selectedExercise = '';

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  function renderPicker() {
    const tabsEl = document.getElementById('dayTabs');
    tabsEl.innerHTML = dayNames.map(d =>
      `<button class="day-tab ${d===selectedDay?'active':''}" data-day="${d.replace(/"/g,'&quot;')}">${d.split(' · ')[1] || d}</button>`
    ).join('');

    const gridEl = document.getElementById('exGrid');
    gridEl.innerHTML = ROUTINE[selectedDay].map(ex =>
      `<button class="ex-chip ${ex===selectedExercise?'selected':''}" data-ex="${ex.replace(/"/g,'&quot;')}">${ex}</button>`
    ).join('');
  }

  document.getElementById('dayTabs').addEventListener('click', e => {
    const btn = e.target.closest('.day-tab');
    if (btn) pickDay(btn.getAttribute('data-day'));
  });
  document.getElementById('exGrid').addEventListener('click', e => {
    const btn = e.target.closest('.ex-chip');
    if (btn) pickExercise(btn.getAttribute('data-ex'));
  });

  function pickDay(d) {
    if (workoutMode) return;
    selectedDay = d;
    selectedExercise = '';
    document.getElementById('exercise').value = '';
    document.getElementById('lastHint').textContent = '';
    renderPicker();
  }

  function pickExercise(ex) {
    selectedExercise = ex;
    document.getElementById('exercise').value = ex;
    renderPicker();
    if (!editingId) prefillLast(ex);
  }

  function prefillLast(ex) {
    const data = entries.filter(e => e.exercise === ex).sort((a,b) => a.date.localeCompare(b.date));
    const hintEl = document.getElementById('lastHint');
    if (data.length === 0) {
      hintEl.textContent = '';
      document.getElementById('weight').value = '';
      document.getElementById('reps').value = '';
      document.getElementById('sets').value = '';
      return;
    }
    const last = data[data.length - 1];
    document.getElementById('weight').value = last.weight;
    document.getElementById('reps').value = last.reps;
    document.getElementById('sets').value = last.sets;
    const max = Math.max(...data.map(d => d.weight));
    hintEl.textContent = `Última vez: ${last.weight}kg × ${last.reps} × ${last.sets} · Récord: ${max}kg`;
  }

  document.getElementById('date').value = new Date().toISOString().slice(0,10);
  renderPicker();

  // ---------- Modo entrenamiento ----------
  function startWorkout() {
    workoutMode = true;
    workoutList = ROUTINE[selectedDay];
    workoutIndex = 0;
    document.getElementById('dayTabs').style.display = 'none';
    document.getElementById('exGrid').style.display = 'none';
    document.getElementById('startWorkoutBtn').style.display = 'none';
    document.getElementById('workoutPanel').style.display = 'block';
    document.getElementById('addBtn').style.display = 'none';
    document.getElementById('workoutActions').style.display = 'flex';
    document.getElementById('exitWorkoutBtn').style.display = 'block';
    loadWorkoutStep();
  }

  function loadWorkoutStep() {
    const ex = workoutList[workoutIndex];
    selectedExercise = ex;
    document.getElementById('exercise').value = ex;
    document.getElementById('workoutProgress').textContent = `Ejercicio ${workoutIndex + 1}/${workoutList.length}`;
    document.getElementById('workoutExName').textContent = ex;
    prefillLast(ex);
    document.getElementById('addBtnWorkout').textContent =
      (workoutIndex === workoutList.length - 1) ? 'Guardar y terminar ✔️' : 'Guardar y siguiente ▶';
  }

  function advanceWorkout() {
    workoutIndex++;
    if (workoutIndex >= workoutList.length) {
      showToast('¡Entrenamiento completo! 💪');
      exitWorkout();
    } else {
      loadWorkoutStep();
    }
  }

  function skipWorkoutStep() {
    advanceWorkout();
  }

  // ---------- Cronómetro de descanso ----------
  const DEFAULT_REST = 150; // 2:30, ajustable con +15s/-15s
  let restSeconds = DEFAULT_REST;
  let restInterval = null;
  let restPaused = false;

  function formatClock(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.25, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.18);
      setTimeout(() => {
        const osc2 = ctx.createOscillator();
        osc2.connect(gain);
        osc2.type = 'sine';
        osc2.frequency.value = 1046;
        osc2.start();
        osc2.stop(ctx.currentTime + 0.4);
      }, 220);
    } catch (e) { /* audio no disponible */ }
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }

  function startRestTimer(seconds) {
    clearInterval(restInterval);
    restSeconds = seconds != null ? seconds : DEFAULT_REST;
    restPaused = false;
    document.getElementById('restPauseBtn').textContent = 'Pausar';
    const panel = document.getElementById('restTimer');
    panel.classList.add('show');
    panel.classList.remove('done');
    document.getElementById('restLabel').textContent = 'Descanso';
    document.getElementById('restClock').classList.remove('done');
    updateRestDisplay();
    restInterval = setInterval(() => {
      if (restPaused) return;
      restSeconds--;
      if (restSeconds <= 0) {
        restSeconds = 0;
        updateRestDisplay();
        clearInterval(restInterval);
        restInterval = null;
        document.getElementById('restTimer').classList.add('done');
        document.getElementById('restClock').classList.add('done');
        document.getElementById('restLabel').textContent = '¡Listo para el siguiente!';
        beep();
        return;
      }
      updateRestDisplay();
    }, 1000);
  }

  function updateRestDisplay() {
    document.getElementById('restClock').textContent = formatClock(restSeconds);
  }

  function adjustRest(delta) {
    restSeconds = Math.max(0, restSeconds + delta);
    updateRestDisplay();
    if (restSeconds > 0) {
      document.getElementById('restTimer').classList.remove('done');
      document.getElementById('restClock').classList.remove('done');
      document.getElementById('restLabel').textContent = 'Descanso';
      if (!restInterval || restPaused === true) {
        // si estaba parado por haber llegado a 0, lo reactivamos
      }
      if (!restInterval) {
        restPaused = false;
        document.getElementById('restPauseBtn').textContent = 'Pausar';
        restInterval = setInterval(() => {
          if (restPaused) return;
          restSeconds--;
          if (restSeconds <= 0) {
            restSeconds = 0;
            updateRestDisplay();
            clearInterval(restInterval);
            restInterval = null;
            document.getElementById('restTimer').classList.add('done');
            document.getElementById('restClock').classList.add('done');
            document.getElementById('restLabel').textContent = '¡Listo para el siguiente!';
            beep();
            return;
          }
          updateRestDisplay();
        }, 1000);
      }
    }
  }

  function togglePauseRest() {
    restPaused = !restPaused;
    document.getElementById('restPauseBtn').textContent = restPaused ? 'Reanudar' : 'Pausar';
  }

  function hideRestTimer() {
    clearInterval(restInterval);
    restInterval = null;
    document.getElementById('restTimer').classList.remove('show');
  }
  // ---------------------------------------------

  function exitWorkout() {
    hideRestTimer();
    workoutMode = false;
    document.getElementById('dayTabs').style.display = '';
    document.getElementById('exGrid').style.display = '';
    document.getElementById('startWorkoutBtn').style.display = 'block';
    document.getElementById('workoutPanel').style.display = 'none';
    document.getElementById('addBtn').style.display = 'block';
    document.getElementById('workoutActions').style.display = 'none';
    document.getElementById('exitWorkoutBtn').style.display = 'none';
    selectedExercise = '';
    document.getElementById('exercise').value = '';
    document.getElementById('weight').value = '';
    document.getElementById('reps').value = '';
    document.getElementById('sets').value = '';
    document.getElementById('lastHint').textContent = '';
    renderPicker();
  }
  // -----------------------------------------

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    render();
  }

  function addEntry() {
    const exercise = document.getElementById('exercise').value.trim();
    const weight = parseFloat(document.getElementById('weight').value);
    const reps = parseInt(document.getElementById('reps').value);
    const sets = parseInt(document.getElementById('sets').value);
    const date = document.getElementById('date').value;
    const errEl = document.getElementById('error');

    if (!exercise || isNaN(weight) || isNaN(reps) || isNaN(sets) || !date) {
      errEl.textContent = 'Selecciona un ejercicio y rellena kg, reps y series.';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';

    if (editingId) {
      const idx = entries.findIndex(e => e.id === editingId);
      if (idx !== -1) {
        entries[idx] = { ...entries[idx], exercise, weight, reps, sets, date };
      }
      openExercise = exercise;
      showToast('Registro actualizado');
      cancelEdit(false);
    } else {
      entries.push({ id: Date.now().toString() + Math.random().toString(36).slice(2,6), exercise, weight, reps, sets, date });
      openExercise = exercise;

      if (workoutMode) {
        showToast('Guardado ✔️');
        entries.sort((a,b) => a.date.localeCompare(b.date));
        save();
        advanceWorkout();
        startRestTimer();
        return;
      }

      showToast('Registro añadido');
      document.getElementById('weight').value = '';
      document.getElementById('reps').value = '';
      document.getElementById('sets').value = '';
      selectedExercise = '';
      document.getElementById('exercise').value = '';
      document.getElementById('lastHint').textContent = '';
      renderPicker();
    }

    entries.sort((a,b) => a.date.localeCompare(b.date));
    save();
  }

  function startEdit(id) {
    if (workoutMode) exitWorkout();
    const e = entries.find(x => x.id === id);
    if (!e) return;
    editingId = id;
    selectedExercise = e.exercise;
    for (const d of dayNames) {
      if (ROUTINE[d].includes(e.exercise)) { selectedDay = d; break; }
    }
    document.getElementById('exercise').value = e.exercise;
    document.getElementById('weight').value = e.weight;
    document.getElementById('reps').value = e.reps;
    document.getElementById('sets').value = e.sets;
    document.getElementById('date').value = e.date;
    document.getElementById('lastHint').textContent = '';
    document.getElementById('addBtn').textContent = 'Guardar cambios';
    document.getElementById('editingBadge').classList.add('show');
    document.getElementById('cancelEditBtn').classList.add('show');
    renderPicker();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelEdit(clearForm = true) {
    editingId = null;
    document.getElementById('addBtn').textContent = '+ Añadir registro';
    document.getElementById('editingBadge').classList.remove('show');
    document.getElementById('cancelEditBtn').classList.remove('show');
    if (clearForm) {
      document.getElementById('weight').value = '';
      document.getElementById('reps').value = '';
      document.getElementById('sets').value = '';
      selectedExercise = '';
      document.getElementById('exercise').value = '';
      document.getElementById('lastHint').textContent = '';
      renderPicker();
    }
  }

  function deleteEntry(id) {
    entries = entries.filter(e => e.id !== id);
    if (editingId === id) cancelEdit();
    showToast('Registro borrado');
    save();
  }

  function toggleExercise(name) {
    openExercise = openExercise === name ? null : name;
    render();
  }

  function makeSparkline(data) {
    if (data.length < 2) return '';
    const w = 300, h = 110, pad = 10;
    const weights = data.map(d => d.weight);
    const min = Math.min(...weights), max = Math.max(...weights);
    const range = max - min || 1;
    const pts = data.map((d, i) => {
      const x = pad + (i / (data.length - 1)) * (w - pad*2);
      const y = h - pad - ((d.weight - min) / range) * (h - pad*2);
      return [x, y];
    });
    const path = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0] + ',' + p[1]).join(' ');
    const dots = pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#a3e635"/>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <path d="${path}" fill="none" stroke="#a3e635" stroke-width="2" vector-effect="non-scaling-stroke"/>
      ${dots}
    </svg>`;
  }

  function render() {
    const listEl = document.getElementById('list');
    const exNames = [...new Set(entries.map(e => e.exercise))].sort();

    if (exNames.length === 0) {
      listEl.innerHTML = '<div class="empty">Aún no has registrado ninguna carga.</div>';
      return;
    }

    listEl.innerHTML = exNames.map(name => {
      const data = entries.filter(e => e.exercise === name).sort((a,b) => a.date.localeCompare(b.date));
      const last = data[data.length - 1];
      const first = data[0];
      const diff = data.length > 1 ? (last.weight - first.weight) : 0;
      const isOpen = openExercise === name;
      const maxWeight = Math.max(...data.map(d => d.weight));

      let warnHtml = '';
      if (data.length >= 3) {
        const last3 = data.slice(-3);
        if (last3.every(d => d.weight === last3[0].weight)) {
          warnHtml = `<div class="ex-warn">⚠️ ${last3.length} sesiones en ${last3[0].weight}kg, prueba a subir</div>`;
        }
      }

      const rows = [...data].reverse().map(e => `
        <div class="entry">
          <span class="entry-date">${e.date}</span>
          <span class="entry-mid">${e.weight}kg × ${e.reps} × ${e.sets}${e.weight === maxWeight ? '<span class="pr-badge">🏆</span>' : ''}</span>
          <span class="entry-actions">
            <button class="entry-edit" data-id="${e.id}">✎</button>
            <button class="entry-del" data-id="${e.id}">✕</button>
          </span>
        </div>
      `).join('');

      return `
        <div class="card exercise-card">
          <div class="ex-header" data-name="${name.replace(/"/g,'&quot;')}">
            <div>
              <div class="ex-name">${name}</div>
              <div class="ex-last">Última: ${last.weight}kg × ${last.reps} × ${last.sets}</div>
              <div class="ex-pr">🏆 Récord: ${maxWeight}kg</div>
              ${warnHtml}
            </div>
            ${diff !== 0 ? `<div class="diff ${diff>0?'pos':'neg'}">${diff>0?'+':''}${diff.toFixed(1)}kg</div>` : ''}
          </div>
          <div class="ex-body ${isOpen ? 'open' : ''}">
            ${makeSparkline(data)}
            ${rows}
          </div>
        </div>
      `;
    }).join('');
  }

  document.getElementById('list').addEventListener('click', function(e) {
    const delBtn = e.target.closest('.entry-del');
    if (delBtn) {
      e.stopPropagation();
      if (confirm('¿Borrar este registro?')) {
        deleteEntry(delBtn.getAttribute('data-id'));
      }
      return;
    }
    const editBtn = e.target.closest('.entry-edit');
    if (editBtn) {
      e.stopPropagation();
      startEdit(editBtn.getAttribute('data-id'));
      return;
    }
    const header = e.target.closest('.ex-header');
    if (header) {
      toggleExercise(header.getAttribute('data-name'));
    }
  });

  function exportData() {
    const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const fecha = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `backup-cargas-${fecha}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Backup exportado');
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const imported = JSON.parse(e.target.result);
        if (!Array.isArray(imported)) throw new Error('formato inválido');
        const merge = confirm('¿Fusionar con tus datos actuales? Aceptar = fusionar, Cancelar = reemplazar todo.');
        if (merge) {
          const existingIds = new Set(entries.map(x => x.id));
          const nuevos = imported.filter(x => !existingIds.has(x.id));
          entries = entries.concat(nuevos);
        } else {
          entries = imported;
        }
        entries.sort((a,b) => a.date.localeCompare(b.date));
        save();
        showToast('Backup importado');
      } catch (err) {
        alert('No se pudo leer el archivo. ¿Es un backup válido?');
      }
      event.target.value = '';
    };
    reader.readAsText(file);
  }

  render();
</script>
</body>
</html>
